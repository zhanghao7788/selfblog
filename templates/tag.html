<h1 class="page-title">标签: #{{tag}}</h1>

{{#posts}}
<article class="post-card">
  <h2><a href="posts/{{slug}}.html">{{title}}</a></h2>
  <div class="post-meta">
    <time datetime="{{date}}">{{date}}</time>
    {{#tags}}
    <a href="tags/{{.}}.html" class="tag">#{{.}}</a>
    {{/tags}}
  </div>
  <p class="post-excerpt">{{excerpt}}</p>
</article>
{{/posts}}

{{^posts}}
<p class="empty">该标签下还没有文章。</p>
{{/posts}}

<nav class="post-nav">
  <a href="{{base}}">&larr; 返回首页</a>
</nav>
