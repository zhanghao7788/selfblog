<div class="index-layout">
  <aside class="sidebar">
    <h3>分类</h3>
    <ul class="category-list">
      {{#categories}}
      <li><a href="categories/{{.}}.html">{{.}}</a></li>
      {{/categories}}
    </ul>
  </aside>

  <div class="post-list">
    <h1 class="page-title">所有文章</h1>

    {{#posts}}
    <article class="post-card">
      <h2><a href="posts/{{slug}}.html">{{title}}</a></h2>
      <div class="post-meta">
        {{#category}}<a href="categories/{{.}}.html" class="category">{{.}}</a><span class="meta-sep">|</span>{{/category}}
        <time datetime="{{date}}">{{date}}</time>
        {{#tags}}
        <a href="tags/{{.}}.html" class="tag">#{{.}}</a>
        {{/tags}}
      </div>
      <p class="post-excerpt">{{excerpt}}</p>
    </article>
    {{/posts}}

    {{^posts}}
    <p class="empty">还没有文章。</p>
    {{/posts}}
  </div>
</div>
